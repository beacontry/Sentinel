name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Blocking, like every other gate: banned stale-doc markers (retired
      # features, old constants/defaults, dead gate orderings) must not
      # appear in current-truth doc surfaces, and anchored counts must cite
      # the newest migration. See scripts/check-doc-staleness.mjs and
      # ~/.claude/patterns-docs.md § Automation Hooks.
      - name: Doc staleness check
        run: npm run docs:check

      - name: Test
        run: npm test

  build:
    name: Build & Push Image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    # packages:read so the auto-minted GITHUB_TOKEN can pull from ghcr.io.
    # No long-lived PAT needed — the token is scoped to this workflow run
    # and dies when it ends, eliminating an entire class of expired/revoked
    # credential failures.
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # REPO + GH_USER: passed through so the image path auto-updates
          # if the repo gets transferred (e.g. ixiondt/Sentinel →
          # beacontry/sentinel) without needing to edit this workflow.
          # GHCR requires lowercase image names; `github.repository`
          # preserves the original case, so we lowercase in-script.
          # GHCR_TOKEN is the workflow's auto-minted GITHUB_TOKEN — see
          # CLAUDE.md / patterns-deploy.md § "Registry Auth Without PATs".
          envs: GHCR_TOKEN,REPO,GH_USER
          script: |
            # set -e + pipefail: a podman login/pull 403 must FAIL the workflow.
            # Pre-PR this script swallowed errors; podman run then used the
            # locally-cached :latest tag and the health check passed against
            # stale code — every "deploy" was a silent no-op for 10 days.
            set -eo pipefail
            IMAGE_LC="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]'):latest"
            echo "Deploying image: $IMAGE_LC"

            # Login → pull → logout in one shot using ephemeral GITHUB_TOKEN.
            # Username for GHCR login can be anything when using GITHUB_TOKEN.
            echo "Logging into ghcr.io with workflow GITHUB_TOKEN..."
            echo "$GHCR_TOKEN" | sudo -u sn-deploy -i podman login ghcr.io -u "$GH_USER" --password-stdin

            echo "Pulling fresh image..."
            sudo -u sn-deploy -i podman pull "$IMAGE_LC"

            # Verify the pulled image is actually new — print Created date so a
            # future regression (e.g. cached image being served) is visible in
            # the workflow log without needing to SSH and inspect.
            echo "Pulled image metadata:"
            sudo -u sn-deploy -i podman image inspect "$IMAGE_LC" --format 'Created: {{.Created}} | Id: {{.Id}}'

            # Logout so the ephemeral token can't be reused locally after the
            # workflow ends. Token expires anyway, but no reason to leave creds
            # in /run/user/<uid>/containers/auth.json.
            echo "Logging out of ghcr.io..."
            sudo -u sn-deploy -i podman logout ghcr.io || true

            echo "Replacing container..."
            sudo -u sn-deploy -i podman stop sentinel-app 2>/dev/null || true
            sudo -u sn-deploy -i podman rm sentinel-app 2>/dev/null || true
            sudo -u sn-deploy -i bash -c 'mkdir -p /opt/apps/sentinel/cache'
            sudo -u sn-deploy -i podman run -d --name sentinel-app --network=host --env-file /opt/apps/sentinel/.env -e NODE_ENV=production -e HOSTNAME=0.0.0.0 -e PORT=3010 -e NEXT_TELEMETRY_DISABLED=1 -e CACHE_DIR=/data/cache -v /opt/apps/sentinel/cache:/data/cache:Z --restart always -m 2g "$IMAGE_LC"
            echo "Container started"

            # Health check — wait for app to be ready
            for i in 1 2 3 4 5; do
              sleep 5
              if sudo -u sn-deploy -i bash -c 'podman exec sentinel-app curl -sf http://localhost:3010/api/health' > /dev/null 2>&1; then
                echo "Health check passed on attempt $i"
                exit 0
              fi
              echo "Health check attempt $i failed, retrying..."
            done
            echo "Health check failed after 5 attempts!"
            sudo -u sn-deploy -i bash -c 'podman logs --tail 50 sentinel-app'
            exit 1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GH_USER: ${{ github.actor }}
