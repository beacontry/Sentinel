name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_PAT
          script: |
            sudo -u sn-deploy -i bash -c "
              echo '$GHCR_PAT' | podman login ghcr.io -u ixiondt --password-stdin 2>/dev/null
              podman pull ghcr.io/ixiondt/sentinel:latest
              podman stop sentinel-app 2>/dev/null || true
              podman rm sentinel-app 2>/dev/null || true
              podman run -d \
                --name sentinel-app \
                --network=host \
                --env-file /opt/apps/sentinel/.env \
                -e NODE_ENV=production \
                -e HOSTNAME=0.0.0.0 \
                -e PORT=3010 \
                -e NEXT_TELEMETRY_DISABLED=1 \
                --restart always \
                -m 1g \
                ghcr.io/ixiondt/sentinel:latest
            "
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
