name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  build:
    name: Build & Push Image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # REPO + GH_USER: passed through so the image path auto-updates
          # if the repo gets transferred (e.g. ixiondt/Sentinel →
          # beacontry/sentinel) without needing to edit this workflow.
          # GHCR requires lowercase image names; `github.repository`
          # preserves the original case, so we lowercase in-script.
          envs: GHCR_PAT,REPO,GH_USER
          script: |
            IMAGE="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]'):latest"
            echo "Deploying image: $IMAGE"
            echo "$GHCR_PAT" | sudo -u sn-deploy -i podman login ghcr.io -u "$GH_USER" --password-stdin
            echo "Login done, pulling image..."
            sudo -u sn-deploy -i podman pull "$IMAGE"
            echo "Pull done, replacing container..."
            sudo -u sn-deploy -i podman stop sentinel-app 2>/dev/null || true
            sudo -u sn-deploy -i podman rm sentinel-app 2>/dev/null || true
            sudo -u sn-deploy -i bash -c 'mkdir -p /opt/apps/sentinel/cache'
            sudo -u sn-deploy -i podman run -d --name sentinel-app --network=host --env-file /opt/apps/sentinel/.env -e NODE_ENV=production -e HOSTNAME=0.0.0.0 -e PORT=3010 -e NEXT_TELEMETRY_DISABLED=1 -e CACHE_DIR=/data/cache -v /opt/apps/sentinel/cache:/data/cache:Z --restart always -m 2g "$IMAGE"
            echo "Container started"
            # Health check — wait for app to be ready
            for i in 1 2 3 4 5; do
              sleep 5
              if sudo -u sn-deploy -i bash -c 'podman exec sentinel-app curl -sf http://localhost:3010/api/health' > /dev/null 2>&1; then
                echo "Health check passed on attempt $i"
                exit 0
              fi
              echo "Health check attempt $i failed, retrying..."
            done
            echo "Health check failed after 5 attempts!"
            sudo -u sn-deploy -i bash -c 'podman logs --tail 50 sentinel-app'
            exit 1
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          REPO: ${{ github.repository }}
          GH_USER: ${{ github.actor }}
